<!doctype html>

                background-color: rgb(255, 221, 255);

                box-sizing: border-box;
            }
            a {
                text-decoration: none;
                color: rgb(89, 6, 145);

        </style>
    </head>
    <body>
        <header>
            <nav>

                        aria-hidden="true"
                        xmlns="xmlhttp://www.w3.org/2000/svgxml"
                        fill="none"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"

                            strokeLinecap="round"
                            strokeLinejoin="round"

                        height="20"

                        stroke="currentColor"
                    >
                        <path
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            strokeWidth="2"
                            d="M9 5l7 7-7 7"
                        />
                    </svg>
                </div>
            </nav>
        </header>
        <script src="breadcrumbs.js"></script>
